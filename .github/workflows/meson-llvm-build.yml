name: Meson LLVM Build
on: [push, pull_request]
jobs:
  Meson-Build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update
      - run: sudo apt install -y libdrm-dev libegl-dev
      - run: sudo apt install -y libwayland-dev libwayland-egl-backend-dev eglexternalplatform-dev
      - run: sudo apt install -y meson ninja-build clang
      # Ubuntu's wayland-protocols is too old for linux-dmabuf v6.
      - name: Build wayland-protocols 1.49 from source
        run: |
          curl -L https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz | tar xJ
          cd wayland-protocols-1.49
          meson setup build --prefix=/usr -Dtests=false
          ninja -C build
          sudo ninja -C build install
      - name: meson build
        run: meson build
        env:
          CC: clang
      - run: ninja -C build
      - run: sudo ninja -C build install
